[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycircuitsim-core"
version = "1.0.0"
description = "Shared interfaces and models for circuit simulation tools (pyplecs, pygeckocircuit)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "NTBEES2 Team"},
]
dependencies = [
    "pydantic>=2.0",
    "pandas>=1.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["pycircuitsim_core*"]
