[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygeckocircuit"
version = "1.1.0"
description = "Python wrapper for GeckoCIRCUITS circuit simulation via REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "NTBEES2 Team"},
]
dependencies = [
    "pycircuitsim-core>=1.0.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.0",
    "websockets>=11.0",
]
cache = [
    "pyarrow>=12.0",
]
logging = [
    "structlog>=23.0",
]
full = [
    "pygeckocircuit[api,cache,logging]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
pygeckocircuit-api = "pygeckocircuit.api:main"
pygeckocircuit-gui = "pygeckocircuit.webgui:run_app"
pygeckocircuit-setup = "pygeckocircuit.cli.installer:main"

[tool.setuptools.packages.find]
include = ["pygeckocircuit*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
