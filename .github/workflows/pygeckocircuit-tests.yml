name: pygeckocircuit tests

on:
  push:
    branches: [main]
    paths:
      - "packages/pygeckocircuit/**"
      - "packages/pycircuitsim-core/**"
      - ".github/workflows/pygeckocircuit-tests.yml"
  pull_request:
    paths:
      - "packages/pygeckocircuit/**"
      - "packages/pycircuitsim-core/**"
      - ".github/workflows/pygeckocircuit-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e packages/pycircuitsim-core
          pip install -e packages/pygeckocircuit

      - name: Run pygeckocircuit tests
        run: python -m pytest packages/pygeckocircuit/tests/ -v
