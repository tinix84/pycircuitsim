name: pyplecs tests

on:
  push:
    branches: [main]
    paths:
      - "packages/pyplecs/**"
      - "packages/pycircuitsim-core/**"
      - ".github/workflows/pyplecs-tests.yml"
  pull_request:
    paths:
      - "packages/pyplecs/**"
      - "packages/pycircuitsim-core/**"
      - ".github/workflows/pyplecs-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest matplotlib
          pip install -e packages/pycircuitsim-core
          pip install -e packages/pyplecs

      - name: Run pyplecs mission_profile tests
        run: python -m pytest packages/pyplecs/tests/test_mission_profile.py -v
        env:
          # Avoid importing from local source tree
          PYTHONDONTWRITEBYTECODE: 1
